name: Scout
on:
  schedule:
    # Täglich etwa alle 15 Minuten (Krypto handelt auch am Wochenende), Zeiten in UTC
    - cron: "7,22,37,52 5-21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: Testnachricht aufs Handy
        type: boolean
        default: false
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: scout
  cancel-in-progress: false
jobs:
  lauf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    env:
      TZ: Europe/Berlin
    steps:
      - uses: actions/checkout@v7
      - name: Testnachricht
        if: inputs.test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 scout.py test >/dev/null
      - name: Letzten Stand holen
        run: |
          code=0
          git ls-remote --exit-code --heads origin daten >/dev/null || code=$?
          if [ "$code" = 0 ]; then
            git fetch --depth 1 origin daten
            git show FETCH_HEAD:zustand.enc > zustand.enc
          elif [ "$code" != 2 ]; then
            exit "$code"
          fi
      - name: Pruefen
        id: pruefen
        continue-on-error: true
        env:
          PASSWORT: ${{ secrets.PASSWORT }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 cloud.py
      - name: Stand speichern
        if: always() && steps.pruefen.outcome != 'skipped' && hashFiles('zustand.enc') != ''
        run: |
          blob=$(git hash-object -w zustand.enc)
          baum=$(printf '100644 blob %s\tzustand.enc\n' "$blob" | git mktree)
          export GIT_AUTHOR_NAME=scout GIT_AUTHOR_EMAIL=scout@users.noreply.github.com
          export GIT_COMMITTER_NAME=scout GIT_COMMITTER_EMAIL=scout@users.noreply.github.com
          neu=$(git commit-tree "$baum" -m "Stand")
          git push --force origin "$neu:refs/heads/daten"
      - uses: actions/configure-pages@v6
        if: steps.pruefen.outcome == 'success'
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v5
        id: hochladen
        if: steps.pruefen.outcome == 'success'
        continue-on-error: true
        with:
          path: site
      - name: Veroeffentlichen
        id: versuch1
        if: steps.hochladen.outcome == 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Kurz warten
        if: steps.versuch1.outcome == 'failure'
        run: sleep 60
      - name: Veroeffentlichen, zweiter Versuch
        id: versuch2
        if: steps.versuch1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      # Fehler-Mail nur, wenn schon lange nichts mehr geklappt hat.
      # 12 Stunden, weil nachts ohnehin eine Pause von gut 7 Stunden ist.
      - name: Fehler nur bei langem Ausfall melden
        if: steps.versuch1.outcome != 'success' && steps.versuch2.outcome != 'success'
        run: |
          python3 - <<'ENDE'
          import sys, time, urllib.request
          from email.utils import parsedate_to_datetime
          url = "https://ruehlsbestes.github.io/aktienscout/daten.enc?t=%d" % time.time()
          with urllib.request.urlopen(urllib.request.Request(url, method="HEAD"), timeout=30) as a:
              stunden = (time.time() - parsedate_to_datetime(a.headers["Last-Modified"]).timestamp()) / 3600
          print(f"Letzter erfolgreicher Stand vor {stunden:.1f} Stunden")
          sys.exit(1 if stunden > 12 else 0)
          ENDE
